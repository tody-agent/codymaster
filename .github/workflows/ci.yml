name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      # build + validate:skills + check:skills + vitest (see test/engineering-kit-gate.test.ts)
      - name: Kit gate
        run: npm run test:gate:kit
